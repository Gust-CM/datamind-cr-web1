<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <title>Panel de análisis de datos con gráficos e indicadores</title>
  <rect width="1200" height="600" fill="#eef4f8"/>
  <!-- Ventana del panel -->
  <rect x="150" y="70" width="900" height="460" rx="20" fill="#ffffff" stroke="#1e3a5f" stroke-width="4"/>
  <rect x="150" y="70" width="900" height="50" rx="20" fill="#1e3a5f"/>
  <circle cx="185" cy="95" r="8" fill="#f2994a"/>
  <circle cx="210" cy="95" r="8" fill="#0f9d8a"/>
  <!-- Gráfico de barras -->
  <rect x="200" y="380" width="50" height="110" fill="#0f9d8a"/>
  <rect x="270" y="320" width="50" height="170" fill="#1e3a5f"/>
  <rect x="340" y="260" width="50" height="230" fill="#0f9d8a"/>
  <rect x="410" y="200" width="50" height="290" fill="#f2994a"/>
  <!-- Gráfico de líneas -->
  <polyline points="540,450 620,380 700,410 780,290 860,320 960,190" fill="none" stroke="#1e3a5f" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="960" cy="190" r="14" fill="#f2994a"/>
  <!-- Indicadores -->
  <rect x="540" y="150" width="160" height="60" rx="10" fill="#0f9d8a"/>
  <rect x="720" y="150" width="120" height="60" rx="10" fill="#f2994a"/>
</svg>
