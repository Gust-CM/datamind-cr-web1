<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" role="img" aria-labelledby="titulo-logo">
  <title id="titulo-logo">DataMind CR</title>
  <!-- Ícono: nodos conectados que representan datos -->
  <circle cx="30" cy="30" r="26" fill="#1e3a5f"/>
  <line x1="18" y1="38" x2="30" y2="20" stroke="#ffffff" stroke-width="3"/>
  <line x1="30" y1="20" x2="42" y2="36" stroke="#ffffff" stroke-width="3"/>
  <line x1="18" y1="38" x2="42" y2="36" stroke="#ffffff" stroke-width="3"/>
  <circle cx="18" cy="38" r="5" fill="#0f9d8a"/>
  <circle cx="30" cy="20" r="5" fill="#f2994a"/>
  <circle cx="42" cy="36" r="5" fill="#0f9d8a"/>
  <!-- Nombre de la empresa -->
  <text x="66" y="39" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1e3a5f">DataMind <tspan fill="#0f9d8a">CR</tspan></text>
</svg>
