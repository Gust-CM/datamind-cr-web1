<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Calendario y reloj de tareas programadas</title>
  <rect width="800" height="600" fill="#eef4f8"/>
  <!-- Calendario -->
  <rect x="100" y="140" width="340" height="320" rx="16" fill="#ffffff" stroke="#1e3a5f" stroke-width="4"/>
  <rect x="100" y="140" width="340" height="70" rx="16" fill="#1e3a5f"/>
  <g fill="#0f9d8a">
    <rect x="140" y="240" width="50" height="50"/><rect x="245" y="240" width="50" height="50"/><rect x="350" y="240" width="50" height="50"/>
    <rect x="140" y="340" width="50" height="50"/><rect x="350" y="340" width="50" height="50"/>
  </g>
  <rect x="245" y="340" width="50" height="50" fill="#f2994a"/>
  <!-- Reloj -->
  <circle cx="580" cy="300" r="130" fill="#ffffff" stroke="#1e3a5f" stroke-width="8"/>
  <line x1="580" y1="300" x2="580" y2="210" stroke="#1e3a5f" stroke-width="10" stroke-linecap="round"/>
  <line x1="580" y1="300" x2="650" y2="330" stroke="#f2994a" stroke-width="10" stroke-linecap="round"/>
</svg>
